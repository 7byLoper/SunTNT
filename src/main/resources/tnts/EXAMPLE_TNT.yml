# Название типа динамита (обязательное поле)
name: "example_tnt"

# Если секцию удалить, этот TNT будет вести себя как обычный ванильный динамит.
options:
  # Форма разрушения блоков: vanilla — ванильный взрыв, ball — полная сфера, cube — полный куб.
  explosive-mode: vanilla
  # Радиус взрыва в блоках. Если параметр удалить, останется ванильный радиус.
  explosive-power: 25
  # На сколько процентов уменьшить урон сущностям.
  # При 70 урон составит 30% от обычного; при 100 и больше урон отключается.
  cut-damage: 70
  # Время от поджога до взрыва в секундах. По умолчанию — 4 секунды, как у ванильного TNT.
  explosive-interval: 8
  # Автоматически поджигать динамит после установки.
  auto-ignite: false
  # Вероятность взрыва TNT, если оно находится в воде. 100 — всегда, 0 — никогда.
  water-chance: 75
  # Уменьшать прочность региона ProtectionStones при взрыве его блока.
  break-ps-region: true

  # Настройки TNT для добычи спавнеров.
  spawner:
    # Шанс срабатывания механики в процентах. При 0 она отключена.
    chance: 30
    # Шанс сохранить тип моба в выпавшем спавнере.
    mob-save-chance: 50
    # Шанс выпадения золотого спавнера SunHolyGoldSpawner.
    gold-chance: 10
    # Шанс выпадения загадочного спавнера SunMysteriousEggs.
    mysterious-chance: 10

  # Создание временного льда после взрыва.
  ice:
    enabled: true
    # Радиус ледяной сферы в блоках.
    radius: 5
    # Через сколько тиков лёд исчезнет. 20 тиков = 1 секунда.
    delay: 200

# Блок разрушается строго по указанным правилам, даже если он обычно устойчив к TNT.
# Удаление настройки материала возвращает его к обычному поведению взрыва.
breakable-blocks:
  WATER:
    # Радиус действия. Если параметр удалить, используется радиус TNT.
    radius: 4
    # Вероятность разрушения блока в процентах.
    chance: 100
    # Вероятность выпадения блока после разрушения в процентах.
    drop-chance: 0
  NETHERITE_BLOCK:
    radius: 4
    chance: 100
    drop-chance: 0

# Блоки заменяются без выпадения предметов.
transformable-blocks:
  # Цепочка tier_black: укреплённый глубинный сланец -> плачущий обсидиан -> обсидиан -> воздух.
  REINFORCED_DEEPSLATE:
    to: CRYING_OBSIDIAN
    radius: 3
  OBSIDIAN:
    to: AIR
    radius: 3
  CRYING_OBSIDIAN:
    to: OBSIDIAN
    radius: 3

spawner_form:
  material: SPAWNER
  display_name: '&#CCCCCCР&#D6D6D6а&#E0E0E0с&#EAEAEAс&#F4F4F4а&fд&fн&fи&fк&f:&f {mob}'
  lore:
    - ''
    - '&8Особенности:'
    - '&#E7E7E7 - автоматически призывает выбранного моба.'

# Настройки предмета динамита
item:
  material: TNT
  display_name: "&6Пример динамита"
  lore:
    - "&7Этот динамит обладает"
    - "&7особыми свойствами"
    - ""
    - "&eРадиус взрыва: &c25 блоков"
    - "&eФорма взрыва: &cсфера"
  amount: 1
  glow: true

# Настройки отображаемого имени
custom_name:
  visible: true
  name: "&6Пример динамита"

# Настройки крафта
recipe:
  # Форма крафта (3 строки по 3 символа, разделенные двоеточиями)
  shape: "ABC:DEF:GHI"

  # Ингредиенты для крафта
  ingredients:
    # Ключи должны соответствовать символам из shape
    A: TNT
    B: DIAMOND
    C: TNT
    D: DIAMOND
    E: GUNPOWDER
    F: DIAMOND
    G: TNT
    H: DIAMOND
    I: TNT

    # Пример с кастомным предметом (требует наличия системы customitem)
    # E: customitem:special_core
