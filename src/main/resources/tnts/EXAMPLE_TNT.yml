# Название типа динамита (обязательное поле)
name: "example_tnt"

# Основные параметры динамита
options:
  # Форма взрыва: vanilla (ванильный), ball (сфера), cube (куб)
  explosive-mode: vanilla

  # Радиус взрыва в блоках
  explosive-power: 25

  # Процент снижения урона по сущностям (при 100 урон полностью отключен)
  cut-damage: 70

  # Интервал взрыва в секундах
  explosive-interval: 8

  # Автоматический поджиг при установке
  auto-ignite: false

  # Шанс взрыва в воде в процентах
  water-chance: 75

  # Игнорировать воду при расчете взрыва блоков за водой
  ignore-water: false

  # Сохранять неразрушимые блоки
  preserve-unbreakable-blocks: false

  # Выпадать ли блокам при взрыве
  drop-blocks: true

  # Уменьшать ли прочность региона ProtectionStones
  break-ps-region: true

  # Настройки выпадения спавнеров
  spawner:
    # Шанс срабатывания механики
    chance: 30

    # Шанс сохранения типа моба
    mob-save-chance: 50

    # Шанс золотого спавнера (SunHolyGoldSpawner)
    gold-chance: 10

    # Шанс загадочного спавнера (SunMysteriousEggs)
    mysterious-chance: 10

  # Создание ледяной сферы после взрыва
  ice:
    enabled: true
    radius: 5
    delay: 200

# Блоки, которые разрушаются по особым правилам
breakable-blocks:
  WATER:
    radius: 4
    chance: 100
    drop-chance: 0

  NETHERITE_BLOCK:
    radius: 4
    chance: 100
    drop-chance: 0

# Блоки, которые трансформируются при взрыве
transformable-blocks:
  REINFORCED_DEEPSLATE:
    to: CRYING_OBSIDIAN
    radius: 3
    chance: 100

  CRYING_OBSIDIAN:
    to: OBSIDIAN
    radius: 3
    chance: 100

  OBSIDIAN:
    to: AIR
    radius: 3
    chance: 100

# Отображение выпавшего спавнера
spawner_form:
  material: SPAWNER
  display_name: '&#CCCCCCР&#D6D6D6а&#E0E0E0с&#EAEAEAс&#F4F4F4а&fд&fн&fи&fк&f:&f {mob}'
  lore:
    - ''
    - '&8Особенности:'
    - '&#E7E7E7 - автоматически призывает выбранного моба.'

# Настройки предмета динамита
item:
  material: TNT
  display_name: "&6Пример динамита"
  lore:
    - "&7Этот динамит обладает"
    - "&7особыми свойствами"
    - ""
    - "&eРадиус взрыва: &c25 блоков"
    - "&eФорма взрыва: &cсфера"
  amount: 1
  glow: true

# Настройки отображаемого имени
custom_name:
  visible: true
  name: "&6Пример динамита"

# Рецепт крафта
recipe:
  shape: "ABC:DEF:GHI"
  ingredients:
    A: TNT
    B: DIAMOND
    C: TNT
    D: DIAMOND
    E: GUNPOWDER
    F: DIAMOND
    G: TNT
    H: DIAMOND
    I: TNT
